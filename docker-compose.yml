services:
  postgres:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=petclinic
      - POSTGRES_USER=petclinic
      - POSTGRES_DB=petclinic
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    ports:
      - "${ALLOY_MGMT_PORT:-12345}:12345" # alloy
      - "${ALLOY_OTLP_GRPC_PORT:-4317}:4317" # OTLP/gRPC
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:4318" # OTLP/HTTP
#      - "12348:12348" # ???
#      - "6832:6832" # jaeger.thrift over binary thrift protocol
#      - "55679:55679" # zpages https://github.com/open-telemetry/opentelemetry-collector/blob/main/extension/zpagesextension/README.md
    volumes:
      - "./config/config.alloy:/etc/alloy/config.alloy"
    command: [
      "run",
      "--server.http.listen-addr=0.0.0.0:12345",
      "--stability.level=experimental", # livedebugging 用
      "/etc/alloy/config.alloy",
    ]
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    volumes:
      - "./config/grafana/provisioning:/etc/grafana/provisioning"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=flameGraph traceqlSearch traceQLStreaming correlations metricsSummary traceqlEditor traceToMetrics traceToProfiles datatrails
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app,grafana-exploretraces-app,grafana-pyroscope-app
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
  mimir: # メトリクス
    image: grafana/mimir:3.2.4@sha256:e4ff85d922c7c0a5131576d2659a1b98b3abfd73c92448dccf8ad3a6049a7ed8
    command: ["-ingester.native-histograms-ingestion-enabled=true", "-config.file=/etc/mimir.yaml"]
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    volumes:
      - "./config/mimir.yaml:/etc/mimir.yaml"
  loki: # ログ
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - "./config/loki.yaml:/etc/loki/loki.yaml"
  tempo: # トレース
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - "./config/tempo.yaml:/etc/tempo.yaml"

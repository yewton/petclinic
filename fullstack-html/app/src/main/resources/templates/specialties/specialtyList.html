<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'specialties')}">

<body>

  <h2>Specialties</h2>

  <a th:href="@{/specialties/new}" class="btn btn-primary">Add Specialty</a>

  <br />
  <br />

  <table class="table table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="specialty : ${specialties}">
        <td th:text="${specialty.name}"></td>
        <td>
          <a th:href="@{/specialties/__${specialty.id}__/edit}" class="btn btn-sm btn-primary">Edit</a>
          <form th:action="@{/specialties/__${specialty.id}__/delete}" method="post" style="display:inline">
            <button type="submit" class="btn btn-sm btn-danger"
              onclick="return confirm('この専門分野を削除してもよろしいですか？')">Delete</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

</body>

</html>

name: APM audit

on:
  pull_request:
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .github/workflows/apm-audit.yml
  push:
    branches:
      - main
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .github/workflows/apm-audit.yml

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        with:
          # Keep this aligned with apm_version in apm.lock.yaml when APM is upgraded.
          apm-version: 0.29.0
          setup-only: true
      - name: Audit agent context
        # This repository has no published organization policy yet. Enable policy
        # discovery here when one is introduced.
        run: apm audit --ci --no-policy

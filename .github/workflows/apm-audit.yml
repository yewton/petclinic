name: APM audit

on:
  pull_request:
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .github/workflows/apm-audit.yml
  push:
    branches:
      - main
    paths:
      - apm.yml
      - apm.lock.yaml
      - .apm/**
      - .agents/**
      - .claude/**
      - .codex/**
      - .github/workflows/apm-audit.yml

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install APM
        run: |
          # Keep this aligned with apm_version in apm.lock.yaml when APM is upgraded.
          python3 -m pip install --user apm-cli==0.29.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Audit agent context
        # This repository has no published organization policy yet. Enable policy
        # discovery here when one is introduced.
        run: apm audit --ci --no-policy

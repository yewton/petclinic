name: CI

on: [push]

# Deny all permissions by default; grant only what each job needs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      verification_metadata_changed: ${{ steps.metadata-diff.outputs.changed }}
    permissions:
      checks: write # https://github.com/mikepenz/action-junit-report/issues/23#issuecomment-1412597753
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6
      - name: Test dependency verification metadata guard
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Preserve dependency verification metadata
        run: cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata.xml"
      - name: Regenerate dependency verification metadata
        run: ./gradlew --write-verification-metadata sha256 check --no-configuration-cache --build-cache --parallel
      - name: Guard dependency verification metadata
        run: python3 .github/scripts/guard_verification_metadata.py "$RUNNER_TEMP/verification-metadata.xml" gradle/verification-metadata.xml
      - name: Execute Gradle Build
        run: ./gradlew check --parallel --warning-mode all --build-cache --configuration-cache
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@3a81627bfac62268172037048872e8ebd4207e6d # v6.4.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
      - name: Check dependency verification metadata changes
        id: metadata-diff
        if: success()
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dependency verification metadata
        if: steps.metadata-diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
          retention-days: 1

  sync-verification-metadata:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.verification_metadata_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Download dependency verification metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata
          path: gradle
      - name: Commit dependency verification metadata
        run: |
          git add -- gradle/verification-metadata.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): update dependency verification metadata'
          git push origin HEAD:main

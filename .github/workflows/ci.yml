name: CI

on: [push]

# Deny all permissions by default; grant only what each job needs
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      checks: write # https://github.com/mikepenz/action-junit-report/issues/23#issuecomment-1412597753
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Execute Gradle Build
        run: ./gradlew check --parallel --warning-mode all --build-cache --configuration-cache
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

  # Resolves the dependency graph so that GitHub's Dependabot alerts can cover
  # this project. GitHub cannot derive the graph on its own here: the versions
  # live in a version catalog that is shared across composite builds.
  #
  # This job only uploads the snapshot as a workflow artifact. Submitting it
  # needs a write token, and this job runs the project's build scripts and
  # Gradle plugins, so the submission happens in dependency-graph-submit.yml
  # instead, in a job that runs no build code.
  #
  # Restricted to main because the snapshot is only consulted for the default
  # branch.
  dependency-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          dependency-graph: generate-and-upload
          cache-disabled: true
